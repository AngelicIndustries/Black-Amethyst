name: Test patches

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - name: Resolve current upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api repos/AngelAuraMC/Amethyst-Android/releases/latest --jq .tag_name)"
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: ${{ steps.upstream.outputs.tag }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exercise upstream and patched account gates
        run: python3 ci/scripts/test_patch.py src
